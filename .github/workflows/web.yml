name: Web authorization portal

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, test and build
        run: pnpm check
        env:
          NEXT_PUBLIC_MAP_STYLE_URL: ${{ vars.MAP_STYLE_URL }}

      - name: Upload deployable web bundle
        uses: actions/upload-artifact@v5
        with:
          name: sushi-radar-web-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 30
