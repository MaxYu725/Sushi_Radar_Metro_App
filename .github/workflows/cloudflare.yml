name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queue-metro-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Validate production build
        working-directory: web
        run: pnpm check
        env:
          NEXT_PUBLIC_MAP_STYLE_URL: ${{ vars.MAP_STYLE_URL }}

      - name: Apply D1 migrations and deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          packageManager: pnpm
          preCommands: wrangler d1 migrations apply queue-metro-auth --remote
          command: deploy
          secrets: |
            RATE_LIMIT_SALT
        env:
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
          NEXT_PUBLIC_MAP_STYLE_URL: ${{ vars.MAP_STYLE_URL }}
